<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria State and LGA Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 25px;
            margin-top: 20px;
        }
        h2 {
            color: #0d6efd;
            margin-bottom: 25px;
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 10px;
        }
        .form-label {
            font-weight: 500;
        }
        .card {
            margin-top: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Nigeria State and Local Government Area Selection</h2>
        
        <form id="nigeriaForm">
            <!-- State of Origin and LGA Selection -->
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">State of Origin</label>
                        <select class="form-control" name="stateOfOrigin" id="stateOfOrigin">
                            <option value="">-- Select State --</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Local Government Area</label>
                        <select class="form-control" name="localGovernment" id="localGovernment">
                            <option value="">-- Select LGA --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Residential State and LGA Selection -->
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Residential State</label>
                        <select class="form-control" name="residentialState" id="residentialState">
                            <option value="">-- Select State --</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Residential Local Government Area</label>
                        <select class="form-control" name="residentialLGA" id="residentialLGA">
                            <option value="">-- Select LGA --</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Submit Form</button>
            </div>
        </form>
        
        <div class="card mt-4">
            <div class="card-header">
                Selected Information
            </div>
            <div class="card-body">
                <p id="selectedOrigin">State of Origin: Not selected</p>
                <p id="selectedOriginLGA">LGA of Origin: Not selected</p>
                <p id="selectedResidential">Residential State: Not selected</p>
                <p id="selectedResidentialLGA">Residential LGA: Not selected</p>
            </div>
        </div>
    </div>

            // Get all state and LGA select elements
            const stateOfOriginSelect = document.getElementById('stateOfOrigin');
            const localGovernmentSelect = document.getElementById('localGovernment');
            const residentialStateSelect = document.getElementById('residentialState');
            const residentialLGASelect = document.getElementById('residentialLGA');

            // Populate state dropdowns
            function populateStateDropdowns() {
                const states = Object.keys(nigerianStates).sort();
                
                // Add states to State of Origin dropdown
                states.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state;
                    option.textContent = state;
                    stateOfOriginSelect.appendChild(option);
                });
                
                // Add states to Residential State dropdown
                states.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state;
                    option.textContent = state;
                    residentialStateSelect.appendChild(option);
                });
            }

            // Update LGA options based on selected state
            function updateLgaOptions(stateSelect, lgaSelect) {
                const selectedState = stateSelect.value;
                
                // Clear existing options except the first one
                while (lgaSelect.options.length > 1) {
                    lgaSelect.remove(1);
                }
                
                if (selectedState && nigerianStates[selectedState]) {
                    // Add LGAs for the selected state
                    nigerianStates[selectedState].sort().forEach(lga => {
                        const option = document.createElement('option');
                        option.value = lga;
                        option.textContent = lga;
                        lgaSelect.appendChild(option);
                    });
                }
                
                // Update the display of selected values
                updateSelectedDisplay();
            }

            // Update the display of selected values
            function updateSelectedDisplay() {
                document.getElementById('selectedOrigin').textContent = 
                    "State of Origin: " + (stateOfOriginSelect.value || "Not selected");
                document.getElementById('selectedOriginLGA').textContent = 
                    "LGA of Origin: " + (localGovernmentSelect.value || "Not selected");
                document.getElementById('selectedResidential').textContent = 
                    "Residential State: " + (residentialStateSelect.value || "Not selected");
                document.getElementById('selectedResidentialLGA').textContent = 
                    "Residential LGA: " + (residentialLGASelect.value || "Not selected");
            }

            // Add event listeners to state dropdowns
            stateOfOriginSelect.addEventListener('change', function() {
                updateLgaOptions(stateOfOriginSelect, localGovernmentSelect);
            });

            residentialStateSelect.addEventListener('change', function() {
                updateLgaOptions(residentialStateSelect, residentialLGASelect);
            });
            
            // Add event listeners to LGA dropdowns
            localGovernmentSelect.addEventListener('change', updateSelectedDisplay);
            residentialLGASelect.addEventListener('change', updateSelectedDisplay);
            
            // Handle form submission
            document.getElementById('nigeriaForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Form submitted with Nigeria state and LGA data!');
            });

            // Initialize the dropdowns
            populateStateDropdowns();
        });
    </script>
