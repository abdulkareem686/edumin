services:
  - type: web
    name: school-management-system
    env: node
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: school_management_db
          property: connectionString
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: school_management_db
    databaseName: school_management
    user: school_admin
    plan: free